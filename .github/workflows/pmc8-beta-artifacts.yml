name: PMC-Eight Beta Artifacts

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Release label used in artifact names"
        required: true
        default: "PMC8-INDI-2.2.1-es1"
      upload_to_release:
        description: "Upload artifacts to the GitHub release named by release_label"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux PC x86_64
            runner: ubuntu-22.04
            platform: linux-x86_64
          - name: Raspberry Pi Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config zip \
            libev-dev zlib1g-dev libcfitsio-dev libnova-dev libusb-1.0-0-dev \
            libcurl4-openssl-dev libgsl-dev libjpeg-dev libfftw3-dev

      - name: Build and package PMC-Eight driver
        env:
          PMC8_BETA_VERSION: ${{ github.event.inputs.release_label }}
          PMC8_BETA_PLATFORM: ${{ matrix.platform }}
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
        run: bash explorescientific/package_pmc8_beta.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmc8-indi-beta-${{ matrix.platform }}
          path: artifacts/*

      - name: Upload release asset
        if: ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_label }}
          files: artifacts/*

  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon arm64
            runner: macos-15
            platform: macos-arm64
          - name: macOS Intel x86_64
            runner: macos-15-intel
            platform: macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew tap indilib/indi || true
          brew install cmake pkg-config libnova cfitsio gsl fftw jpeg-turbo libusb curl libev

      - name: Build and package PMC-Eight driver
        env:
          PMC8_BETA_VERSION: ${{ github.event.inputs.release_label }}
          PMC8_BETA_PLATFORM: ${{ matrix.platform }}
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
        run: bash explorescientific/package_pmc8_beta.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmc8-indi-beta-${{ matrix.platform }}
          path: artifacts/*

      - name: Upload release asset
        if: ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_label }}
          files: artifacts/*
